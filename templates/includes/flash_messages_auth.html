{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm w-full px-4">
    {% for category, message in messages %}
      <div class="p-4 rounded-xl text-sm font-semibold shadow-xl flex items-center gap-3
        {% if category == 'success' %}bg-emerald-500 text-white
        {% elif category == 'danger' %}bg-red-500 text-white
        {% elif category == 'warning' %}bg-amber-500 text-white
        {% else %}bg-blue-500 text-white{% endif %}">
        <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'danger' %}fa-exclamation-circle{% elif category == 'warning' %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
        {{ message }}
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
